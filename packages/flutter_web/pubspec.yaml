name: ovenplayer_flutter_web
description: Flutter web package for OvenPlayer - WebRTC and LL-HLS streaming player for OvenMediaEngine
version: 0.1.0
homepage: https://github.com/AirenSoft/OvenPlayer
repository: https://github.com/AirenSoft/OvenPlayer
issue_tracker: https://github.com/AirenSoft/OvenPlayer/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  web: ^1.0.0
  js: ^0.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      web:
        pluginClass: OvenPlayerFlutterWebPlugin
        fileName: ovenplayer_flutter_web.dart
