name: ovenplayer_flutter_web
description: A Flutter Web wrapper for OvenPlayer that supports WebRTC and LLHLS streaming with full player control capabilities.
version: 0.1.0
homepage: https://github.com/AirenSoft/OvenPlayer
repository: https://github.com/AirenSoft/OvenPlayer

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  js: ^0.6.7
  web: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

platforms:
  web:
